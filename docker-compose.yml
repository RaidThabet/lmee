services:
  postgres:
    image: postgres:18.0
    environment:
    - POSTGRES_DB=${LMEE_POSTGRES_DB}
    - POSTGRES_USER=${LMEE_POSTGRES_USER}
    - POSTGRES_PASSWORD=${LMEE_POSTGRES_PASSWORD}
    ports:
    - "5433:5432"
    volumes:
      - lmee-postgres:/var/lib/postgresql

  keycloak-db:
    image: postgres:18.0
    labels:
      # Keycloak's own database — not the app datasource. Hide it from Spring Boot's
      # docker-compose support so only `postgres` becomes a ConnectionDetails bean.
      org.springframework.boot.ignore: "true"
    environment:
      - POSTGRES_DB=${KEYCLOAK_DB_NAME}
      - POSTGRES_USER=${KEYCLOAK_DB_USERNAME}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - keycloak-postgres:/var/lib/postgresql

  keycloak:
    container_name: "lmee-keycloak"
    ports:
      - "9090:8080"
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
      - --http-enabled=true
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Pins the frontend URL so the `iss` claim is stable and matches KEYCLOAK_ISSUER_URI,
      # instead of being derived from the Host header.
      KC_HOSTNAME: http://localhost:9090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

volumes:
  lmee-postgres:
  keycloak-postgres: